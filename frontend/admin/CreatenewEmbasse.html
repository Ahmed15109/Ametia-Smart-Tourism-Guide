<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Embassy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#f9f9f9;">

  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Create New Embassy</h5>
      </div>
      <div class="card-body">
        <form id="createEmbassyForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="name" class="form-label">Embassy Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter name" required />
          </div>

          <div class="mb-3">
            <label for="country" class="form-label">Country</label>
            <input type="text" class="form-control" id="country" placeholder="Enter country" required />
          </div>

          <div class="mb-3">
            <label for="workingHours" class="form-label">Working Hours</label>
            <input type="number" class="form-control" id="workingHours" placeholder="Enter working hours" required />
          </div>

          <div class="mb-3">
            <label for="contactInfo" class="form-label">Contact Info</label>
            <input type="text" class="form-control" id="contactInfo" placeholder="Enter contact info" />
          </div>

          <div class="mb-3">
            <label for="longitude" class="form-label">Longitude</label>
            <input type="text" class="form-control" id="longitude" placeholder="Enter longitude" />
          </div>

          <div class="mb-3">
            <label for="latitude" class="form-label">Latitude</label>
            <input type="text" class="form-control" id="latitude" placeholder="Enter latitude" />
          </div>

          <div class="mb-3">
            <label for="cityId" class="form-label">City</label>
            <select id="cityId" class="form-select" required>
              <option selected disabled value="">Select City</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="imageFile" class="form-label">Embassy Image</label>
            <input type="file" class="form-control" id="imageFile" accept="image/*" />
          </div>

          <button type="submit" class="btn btn-success w-100">Create</button>
          <div id="resultMessage" class="mt-3"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
  // Load cities into dropdown
  async function loadCities() {
    const cityDropdown = document.getElementById("cityId");
    try {
      const response = await fetch(`${API_BASE_URL}/City/GetCity`);
      const cities = await response.json();

      cities.forEach(city => {
        const option = document.createElement("option");
        option.value = city.id?.toString();
        option.textContent = city.cityName || city.name || city.Name;
        cityDropdown.appendChild(option);
      });
    } catch (err) {
      console.error("Error loading cities:", err);
      showMessage("❌ Failed to load cities", "danger");
    }
  }

  // Submit embassy creation form
  document.getElementById("createEmbassyForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = new FormData();
    formData.append("Name", document.getElementById("name").value.trim());
    formData.append("Country", document.getElementById("country").value.trim());
    formData.append("WorkingHours", document.getElementById("workingHours").value);
    formData.append("ContactInfo", document.getElementById("contactInfo").value.trim());
    formData.append("Longitude", document.getElementById("longitude").value.trim());
    formData.append("Latitude", document.getElementById("latitude").value.trim());
    formData.append("CityId", document.getElementById("cityId").value);

    const imageFile = document.getElementById("imageFile").files[0];
    if (imageFile) {
      formData.append("ImageFile", imageFile);
    }

    try {
      const response = await fetch(`${API_BASE_URL}/Embassies/CreateEmbasses`, {
        method: "POST",
        body: formData
      });

      if (response.ok) {
        showMessage("✅ Embassy created successfully!", "success");
        document.getElementById("createEmbassyForm").reset();
        setTimeout(() => window.location.href = "Embasses.html", 1500);
      } else {
        const error = await response.text();
        showMessage("❌ Failed to create embassy: " + error, "danger");
      }
    } catch (err) {
      showMessage("❌ Error: " + err.message, "danger");
    }
  });

  function showMessage(message, type) {
    const msg = document.getElementById("resultMessage");
    msg.innerHTML = message;
    msg.className = `alert alert-${type}`;
  }

  document.addEventListener("DOMContentLoaded", loadCities);
</script>
</body>
</html>
