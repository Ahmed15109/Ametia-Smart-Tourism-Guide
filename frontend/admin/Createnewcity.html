<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create City | Ametia Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="config.js"></script>
</head>
<body>
  <main class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h1 class="h5 mb-0">Create New City</h1>
      </div>
      <div class="card-body">
        <form id="createCityForm">
          <div class="mb-3">
            <label for="cityName" class="form-label">City Name</label>
            <input type="text" class="form-control" id="cityName" placeholder="Enter city name" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Create</button>
          <div id="resultMessage" class="mt-3" role="status"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("createCityForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const cityName = document.getElementById("cityName").value.trim();
      if (cityName.length === 0) {
        showMessage("Please enter a city name.", "danger");
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/City`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(cityName)
        });

        if (response.ok) {
          showMessage("City created successfully.", "success");
          document.getElementById("createCityForm").reset();
          setTimeout(() => {
            window.location.href = "Cities.html";
          }, 1500);
        } else {
          const error = await response.text();
          showMessage("Failed to create city. " + error, "danger");
        }
      } catch (error) {
        showMessage("Error: " + error.message, "danger");
      }
    });

    function showMessage(message, type) {
      const resultMessage = document.getElementById("resultMessage");
      resultMessage.textContent = message;
      resultMessage.className = `alert alert-${type} mt-3`;
    }
  </script>
</body>
</html>
