<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update City | Ametia Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="config.js"></script>
</head>
<body>
  <main class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-warning text-dark">
        <h1 class="h5 mb-0">Update City</h1>
      </div>
      <div class="card-body">
        <form id="updateForm">
          <div class="mb-3">
            <label for="cityName" class="form-label">City Name</label>
            <input type="text" class="form-control" id="cityName" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Update</button>
          <div id="resultMessage" class="mt-3" role="status"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cityId = params.get("id");

    if (!cityId) {
      alert("City ID is missing");
      window.location.href = "Cities.html";
    }

    async function loadCity() {
      try {
        const response = await fetch(`${API_BASE_URL}/City/loadcity?id=${cityId}`);
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const city = await response.json();
        document.getElementById("cityName").value = city.name || city.cityName || "";
      } catch (error) {
        showMessage("Unable to load the city: " + error.message, "danger");
      }
    }

    document.getElementById("updateForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const newName = document.getElementById("cityName").value.trim();

      try {
        const response = await fetch(`${API_BASE_URL}/City/UpdateCity`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: cityId, name: newName })
        });

        if (response.ok) {
          showMessage("City updated successfully.", "success");
          setTimeout(() => {
            window.location.href = "Cities.html";
          }, 1500);
        } else {
          const error = await response.text();
          showMessage("Failed to update city. " + error, "danger");
        }
      } catch (error) {
        showMessage("Error: " + error.message, "danger");
      }
    });

    function showMessage(message, type) {
      const resultMessage = document.getElementById("resultMessage");
      resultMessage.textContent = message;
      resultMessage.className = `alert alert-${type} mt-3`;
    }

    loadCity();
  </script>
</body>
</html>
